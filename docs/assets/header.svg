    <rect x="358" y="166" width="70" height="26" rx="13" fill="rgba(251,191,36,.16)"/>
    <text x="393" y="184" text-anchor="middle" fill="#fbbf24">scan</text>
    <rect x="438" y="166" width="86" height="26" rx="13" fill="rgba(129,140,248,.18)"/>
    <text x="481" y="184" text-anchor="middle" fill="#a5b4fc">approve</text>
    <rect x="534" y="166" width="70" height="26" rx="13" fill="rgba(251,113,133,.16)"/>
    <text x="569" y="184" text-anchor="middle" fill="#fb7185">pin</text>
