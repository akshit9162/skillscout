[project]
name = "skillscout"
version = "0.1.0"
description = "Keep your agent's skills current: weekly discovery, upstream diffs, safety scans, pinned installs"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
skillscout = "skillscout.cli:main"

[tool.setuptools]
packages = ["skillscout"]

[tool.setuptools.package-data]
skillscout = ["profile.example.toml"]
