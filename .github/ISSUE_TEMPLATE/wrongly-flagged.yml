name: Skill wrongly flagged
description: The scan flagged a skill that's fine, or missed one that isn't
labels: [scanner]
body:
  - type: input
    id: skill
    attributes:
      label: Skill id
      placeholder: owner/repo:skill-name
    validations:
      required: true
  - type: textarea
    id: flag
    attributes:
      label: The flag
      description: The line from `skillscout show <id>`, e.g. `[high] pipes a download into a shell — scripts/install.sh:12`
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it's wrong
      description: For a missed risk, please don't paste working exploit code; describe it and the file it's in.
    validations:
      required: true
