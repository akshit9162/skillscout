name: index

# Crawl and scan the skill ecosystem once a week and publish index.json.gz, which every
# `skillscout discover` downloads and scores locally.
on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays, 03:00 UTC
  workflow_dispatch:

concurrency: index

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write     # upload the index to the `index` release
      id-token: write     # sign the attestation (Sigstore, via GitHub)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install .
      # Only the small JSON state is kept between runs (scan results, list rotation); clones are refetched.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        id: state
        with:
          path: ~/.skillscout/*.json
          key: index-state-${{ github.run_id }}
          restore-keys: index-state-
      - name: Without a warm cache, continue from the last published state
        if: steps.state.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download index -p state.tar.gz && python ci/state.py unpack state.tar.gz || echo "no published state; starting fresh"
      - run: skillscout --profile ci/index-profile.toml index --out index.json.gz
        env:
          # A personal token (repo secret INDEX_TOKEN) allows 5,000 lookups an hour; the job token allows 1,000.
          GITHUB_TOKEN: ${{ secrets.INDEX_TOKEN || github.token }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        if: always()
        with:
          path: ~/.skillscout/*.json
          key: index-state-${{ github.run_id }}
      # Anyone can check the download came from this workflow: gh attestation verify index.json.gz --repo akshit9162/skillscout
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: index.json.gz
      - name: Publish to the index release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view index >/dev/null 2>&1 || gh release create index --target main --latest=false \
            --title "Shared index" --notes "The weekly crawl that \`skillscout discover\` scores locally. Rebuilt every Monday."
          python ci/state.py pack state.tar.gz
          gh release upload index index.json.gz state.tar.gz --clobber
      # The same bytes on a one-commit branch, served by raw.githubusercontent.com and jsDelivr, for networks
      # that reset release downloads. The attestation above covers this copy too (it's the same file).
      - name: Mirror to the index-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir=$(mktemp -d) && cp index.json.gz "$dir"/ && cd "$dir"
          git init -q -b index-data && git add index.json.gz
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "index $(date -u +%F)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" index-data
